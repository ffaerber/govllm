name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/govllm
      - run: docker compose config --quiet
      - run: docker build --check .
